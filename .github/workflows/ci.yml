name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  changes:
    name: Classify latest push
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      contract: ${{ steps.classify.outputs.contract }}
      e2e: ${{ steps.classify.outputs.e2e }}
      security: ${{ steps.classify.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required owners
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_FILE: ci.yml
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  common:
    name: Common gates
    permissions:
      contents: read
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI classifier tests
        run: node --test scripts/ci-changes.test.mjs

  backend:
    name: Backend (quality, pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --extra dev
      - name: Backend quality
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node ../scripts/quality.mjs --mode check --scope backend
      - name: Export OpenAPI contract
        run: .venv/bin/python -m scripts.export_openapi --output .artifacts/openapi.json
      - name: Publish OpenAPI contract
        uses: actions/upload-artifact@v7
        with:
          name: backend-openapi
          path: backend/.artifacts/openapi.json
          if-no-files-found: error
          retention-days: 7
      - name: Radon advisory report
        run: |
          .venv/bin/radon cc app -s -n C
          .venv/bin/radon mi app -s -n B
      - name: Pytest with measured coverage
        run: >-
          .venv/bin/python -m pytest -vv -o faulthandler_timeout=120
          --cov --cov-report=xml --cov-report=term

  frontend:
    name: Frontend (quality, coverage, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend quality
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm quality:check -- --scope frontend
      - name: Vitest with measured coverage
        run: pnpm test:coverage
      - name: Publish frontend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Test duplication advisory
        run: pnpm report:duplicates:tests
      - name: Build
        env:
          BACKEND_ORIGIN: https://backend.ci.invalid
        run: pnpm build

  contract:
    name: API contract (backend to frontend)
    permissions:
      contents: read
    needs: [changes, backend]
    if: always() && needs.changes.outputs.contract == 'true' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download OpenAPI contract
        uses: actions/download-artifact@v6
        with:
          name: backend-openapi
          path: backend-openapi
      - name: Strict contract validation
        env:
          CITELADDER_OPENAPI_JSON: ../backend-openapi/openapi.json
        run: pnpm quality:check -- --scope contract

  e2e:
    name: E2E (playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security (pip-audit, detect-secrets)
    needs: changes
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Dependency audit (SCA)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
      - name: Secrets scan (against committed baseline)
        run: |
          uvx detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'uv\.lock|pnpm-lock\.yaml|\.secrets\.baseline'

  required-quality:
    name: Required
    permissions: {}
    if: always()
    needs: [changes, common, backend, frontend, contract, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected quality owners
        run: |
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.common.result }}" = "success"
          for result in \
            "${{ needs.backend.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.contract.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.security.result }}"; do
            test "$result" = "success" || test "$result" = "skipped"
          done
