name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN across every job below: all three only ever
# check out the repo and run tests/linters, so read access to contents is the
# whole requirement. Declared at workflow level so a new job cannot silently
# inherit the permissive repository default; a job needing more (e.g. posting a
# comment) must opt in with its own narrower block.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check .
      # Type check. Not previously gated, so 35 real errors had accumulated
      # unnoticed (a Literal[] the checker could not read, two shadowed
      # variables that silently widened a type, an optional the caller
      # treated as proven). Cleared to zero, and gated here so the next one
      # fails the build instead of joining a backlog.
      - name: Mypy
        run: uv run mypy app
      # Downward ratchet on module size / function complexity. The July 2026
      # audit found two modules at MI 0.0; they got there because nothing in CI
      # measured either. Fails only on REGRESSION against the checked-in
      # baseline, so improving a number never breaks the build.
      - name: Complexity ratchet
        run: uv run python -m scripts.check_complexity
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (vitest, tsc, policy, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Architecture / token policy
        run: pnpm check:policy
      - name: Build
        env:
          # next.config.ts fails closed for production builds. CI verifies the
          # bundle only, so use an RFC-reserved, unreachable origin here; real
          # deployments must provide the backend service origin themselves.
          BACKEND_ORIGIN: https://backend.ci.invalid
        run: pnpm build

  security:
    name: Security (pip-audit, detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Dependency audit (SCA)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
      - name: Secrets scan (against committed baseline)
        run: |
          uvx detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'uv\.lock|pnpm-lock\.yaml|\.secrets\.baseline'
