name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN across every job below: each one only ever
# checks out the repo and runs tests/linters, so read access to contents is
# the whole requirement. Declared at workflow level so a new job cannot silently
# inherit the permissive repository default; a job needing more (e.g. posting a
# comment) must opt in with its own narrower block.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Complexity policy compares ceilings with the PR/push base so a
          # branch cannot make its own complexity budget larger.
          fetch-depth: 0
      # Pinned to backend/.python-version (3.12), which is also the floor in
      # `requires-python` and the interpreter ./Dockerfile ships. Unpinned, uv
      # resolved the newest interpreter it could find, so the gate and the
      # declared floor disagreed about which Python the code has to work on.
      # All four move together; do not silently widen the pin here.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --extra dev
      # `.` is the backend tree. The two Python files ABOVE it
      # (`reset-db.py`, `docs/validate_documentation.py`) were linted by
      # nothing at all, so they are passed explicitly with this config -- ruff
      # would otherwise fall back to its defaults for them, there being no
      # pyproject.toml at the repository root.
      - name: Ruff
        run: >-
          uv run --frozen --no-sync --no-build ruff check .
          --config pyproject.toml ../reset-db.py ../docs/validate_documentation.py
      # Formatting was fixable but never gated, so drift landed silently in
      # seven files and then showed up as noise in unrelated diffs. Gated here
      # to match `scripts/check.ps1`, which applies the same formatter locally.
      - name: Ruff format
        run: >-
          uv run --frozen --no-sync --no-build ruff format --check .
          --config pyproject.toml ../reset-db.py ../docs/validate_documentation.py
      # Type check. Not previously gated, so 35 real errors had accumulated
      # unnoticed (a Literal[] the checker could not read, two shadowed
      # variables that silently widened a type, an optional the caller
      # treated as proven). Cleared to zero, and gated here so the next one
      # fails the build instead of joining a backlog.
      - name: Mypy
        run: uv run --frozen --no-sync --no-build mypy
      # Fixed CC/LOC defaults plus narrow legacy exceptions. The base-revision
      # comparison rejects higher defaults, higher exceptions, and new
      # exceptions; there is deliberately no baseline rewrite command.
      - name: Complexity policy
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$COMPLEXITY_BASE_SHA" ] && ! [[ "$COMPLEXITY_BASE_SHA" =~ ^0+$ ]]; then
            .venv/bin/python -m scripts.check_complexity --check-policy-diff "$COMPLEXITY_BASE_SHA"
          else
            .venv/bin/python -m scripts.check_complexity
          fi
      # Architecture policy. The backend had no equivalent of the frontend's
      # `check:policy`, so nothing stopped `domain` importing `api`, or a model
      # reaching into a worker. Contracts and their named exceptions live in
      # backend/.importlinter.
      - name: Architecture policy
        run: .venv/bin/lint-imports
      - name: Dead-code policy
        run: .venv/bin/vulture app evaluations scripts --min-confidence 80
      # Declared-but-unused, used-but-undeclared, and transitively-relied-upon
      # dependencies -- a question nothing else here asks: pip-audit checks
      # known CVEs, vulture checks unused code.
      - name: Dependency hygiene
        run: .venv/bin/deptry .
      - name: Radon advisory report
        run: |
          .venv/bin/radon cc app -s -n C
          .venv/bin/radon mi app -s -n B
      # Coverage is measured and published here, and is deliberately NOT a
      # gate -- see the note above ``[tool.coverage.run]`` in pyproject.toml
      # for why. An earlier version of this comment claimed a
      # ``[tool.coverage.report] fail_under`` that was never set, describing a
      # gate that did not exist. What must be tested is decided by
      # ``scripts/validation.json``, which maps production files to the tests
      # that have to run for them.
      - name: Pytest
        # Verbose node ids make an anomalous runner/database stall attributable;
        # faulthandler prints thread stacks if one test exceeds two minutes.
        run: >-
          .venv/bin/python -m pytest -vv -o faulthandler_timeout=120
          --cov --cov-report=xml --cov-report=term

  frontend:
    name: Frontend (vitest, tsc, policy, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Vitest
        run: pnpm test
      - name: Lint
        run: pnpm lint
      # Formatting was enforceable (`format:check` has always existed) but not
      # enforced, so Prettier drift could land silently and then show up as
      # noise in an unrelated diff. Gated here; `pnpm format` fixes it.
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Complexity and duplication policies
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$COMPLEXITY_BASE_SHA" ] && ! [[ "$COMPLEXITY_BASE_SHA" =~ ^0+$ ]]; then
            pnpm check:complexity -- --check-policy-diff "$COMPLEXITY_BASE_SHA"
            pnpm check:duplicates -- --check-policy-diff "$COMPLEXITY_BASE_SHA"
          else
            pnpm check:complexity
            pnpm check:duplicates
          fi
      - name: Test duplication advisory
        run: pnpm report:duplicates:tests
      - name: Architecture / token policy
        run: pnpm check:policy
      - name: Build
        env:
          # next.config.ts fails closed for production builds. CI verifies the
          # bundle only, so use an RFC-reserved, unreachable origin here; real
          # deployments must provide the backend service origin themselves.
          BACKEND_ORIGIN: https://backend.ci.invalid
        run: pnpm build

  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Chromium only: playwright.config.ts declares no projects, so the run
      # uses the default chromium browser. Installing the other two engines
      # would cost download time for browsers nothing here launches.
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # `scripts/validation.json` maps production paths to E2E specs, so those
      # mappings were previously a local-only gate: nothing re-ran them on a
      # pull request. The specs in `playwright.config.ts` stub every
      # `/api/v1/` route (e2e/helpers/app-fixture.ts) and need no backend, so
      # this job runs the whole mapped suite rather than a subset. The
      # real-stack spec and the visual suite own separate configs and stay out
      # (testIgnore), because both need a vertical or committed screenshots
      # that this job does not provision.
      - name: Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security (pip-audit, detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pin as the backend job: the audited requirements must be the set
      # resolved for the interpreter that actually ships.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Dependency audit (SCA)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
      - name: Secrets scan (against committed baseline)
        run: |
          uvx detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'uv\.lock|pnpm-lock\.yaml|\.secrets\.baseline'
