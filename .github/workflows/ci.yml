name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (quality, pytest)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --extra dev
      - name: Backend and documentation quality
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node ../scripts/quality.mjs --mode check --scope backend,docs
      - name: Export OpenAPI contract
        run: .venv/bin/python -m scripts.export_openapi --output .artifacts/openapi.json
      - name: Publish OpenAPI contract
        uses: actions/upload-artifact@v5
        with:
          name: backend-openapi
          path: backend/.artifacts/openapi.json
          if-no-files-found: error
          retention-days: 7
      - name: Radon advisory report
        run: |
          .venv/bin/radon cc app -s -n C
          .venv/bin/radon mi app -s -n B
      - name: Pytest with measured coverage
        run: >-
          .venv/bin/python -m pytest -vv -o faulthandler_timeout=120
          --cov --cov-report=xml --cov-report=term

  frontend:
    name: Frontend (quality, coverage, build)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend quality
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm quality:check -- --scope frontend
      - name: Vitest with measured coverage
        run: pnpm test:coverage
      - name: Publish frontend coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Test duplication advisory
        run: pnpm report:duplicates:tests
      - name: Build
        env:
          BACKEND_ORIGIN: https://backend.ci.invalid
        run: pnpm build

  contract:
    name: API contract (backend to frontend)
    permissions:
      contents: read
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download OpenAPI contract
        uses: actions/download-artifact@v6
        with:
          name: backend-openapi
          path: backend-openapi
      - name: Strict contract validation
        env:
          CITELADDER_OPENAPI_JSON: ../backend-openapi/openapi.json
        run: pnpm quality:check -- --scope contract

  e2e:
    name: E2E (playwright)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security (pip-audit, detect-secrets)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Dependency audit (SCA)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
      - name: Secrets scan (against committed baseline)
        run: |
          uvx detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'uv\.lock|pnpm-lock\.yaml|\.secrets\.baseline'

  required-quality:
    name: Required quality
    permissions: {}
    if: always()
    needs: [backend, frontend, contract, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality owner
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.contract.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
