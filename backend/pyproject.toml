[project]
name = "citeladder-backend"
version = "0.1.0"
description = "CiteLadder AI-Visibility backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "argon2-cffi>=25.1.0,<26",
  "asyncpg>=0.30.0,<1",
  "cryptography>=50.0.0,<51",
  "curl-cffi>=0.11,<1",
  "defusedxml>=0.7.1,<1",
  "email-validator>=2.3.0,<3",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "joserfc>=1.6.8,<2",
  "logfire[fastapi,httpx,sqlalchemy,system-metrics]>=4.20.0,<5",
  "lxml>=6.1.0,<7",
  "protego>=0.3.1,<1",
  # Imported directly by ~30 modules but declared nowhere until the `deptry`
  # gate found it: both arrived only because FastAPI/pydantic-settings happened
  # to pull them in, so a FastAPI bump narrowing either range would have broken
  # the build with no line here to point at.
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10.0,<3",
  # Required, with no direct import to prove it: FastAPI raises at ROUTE
  # DEFINITION time when a path declares ``UploadFile``, which the products and
  # prompts CSV import endpoints do. Removing it fails every test that touches
  # the app, not just the two upload routes.
  "python-multipart>=0.0.31,<1",
  "reportlab>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  # See the pydantic note above; `app/main.py` imports StarletteHTTPException.
  # Range pinned to the version FastAPI already resolved -- a wider floor
  # silently downgraded it.
  "starlette>=1.6,<2",
  "structlog>=25.4.0,<27",
  "tldextract>=5.1.0,<6",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.35.0,<1",
]

# The ONE dev set. CI installs with ``uv sync --frozen --extra dev``, so an
# extra is the only declaration it is guaranteed to read; a parallel
# ``[dependency-groups] dev`` previously held ``asyncpg-stubs`` and re-declared
# two of these, leaving mypy's type coverage dependent on uv's default-group
# behaviour rather than on anything CI actually asks for.
[project.optional-dependencies]
dev = [
  "asyncpg-stubs>=0.31.3,<1",
  "deptry>=0.20,<1",
  "import-linter>=2.0,<3",
  "lxml-stubs>=0.5.1,<1",
  "mypy>=2.3.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=7.0.0,<8",
  "radon==6.0.1",
  "ruff>=0.6.0,<1",
  "types-defusedxml>=0.7.0,<1",
  "types-reportlab>=4.5.1.20260728",
  "vulture==2.16",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "W",
  # flake8-bandit. Catches insecure hashes, unsafe deserialization, shell
  # injection, and ``try``/``except``/``pass``. Chosen over a separate Bandit
  # run so there is one lint process and one suppression syntax.
  "S",
  # flake8-async. The runtime is async end to end, so a blocking `open`,
  # `time.sleep`, or `subprocess.run` inside a coroutine stalls the whole
  # worker loop; nothing else in this stack detects that.
  "ASYNC",
  # flake8-blind-except. Previously enabled for
  # ``app/analysis/site_health/`` alone, where a swallowed DOM traversal error
  # emptied the fact bucket with no log and no error outcome, so the rules
  # scored an extraction bug as "this page has no title / no CTAs / no forms".
  # It is repo-wide now: a broad handler IS often correct (worker loop
  # backstops, rollback teardown), but "often correct" is a reason to write a
  # reviewed ``# noqa: BLE001 - <why>``, not a reason to leave the rule off.
  # While it was scoped, thirteen handlers outside that package carried a
  # ``# noqa: BLE001`` that suppressed nothing and read as a reviewed
  # exception; RUF100 below now fails on that class of decoration.
  "BLE",
  # Ruff-native rules. RUF100 is the load-bearing one: it fails the build on a
  # ``noqa`` that suppresses nothing — a stale code, or a code for a rule this
  # config never enabled. That is the only gate that stops suppression
  # comments from accumulating as decoration.
  "RUF",
]
ignore = [
  # S105/S106/S107 match on the *identifier*, not the value, so every
  # ``RULE_OUTCOME_PASS`` constant and every OAuth ``token`` local trips them;
  # all seven occurrences here were false. Credential detection is owned by
  # the ``detect-secrets`` job in ``.github/workflows/ci.yml``, which compares
  # actual values against a committed baseline instead of guessing from names.
  "S105",
  "S106",
  "S107",
  # RUF001-003 flag typographically correct characters (curly quotes, en
  # dashes, non-breaking spaces) in user-facing copy, prompt templates, and
  # docstrings. This repo ships that text deliberately.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the assertion mechanism of the test suite and of the offline
# eval corpus. Every other S rule stays on for both trees.
"tests/**" = ["S101"]
"evaluations/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The test schema and its engine/connection pool are built once per session
# (see tests/conftest.py). Fixtures AND tests therefore have to share ONE event
# loop for the whole run: with the default function-scoped loop the pool binds
# to the first loop it sees, and every later test fails with "attached to a
# different loop". Both knobs are required — setting only the fixture scope
# leaves tests on their own loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Coverage is MEASURED and published on every CI run. It is deliberately NOT a
# gate, in either the whole-repository or the changed-lines form.
#
# A coverage ratio is a target you can move without improving anything, so
# gating on it reliably produces tests written to move the number rather than
# to describe behaviour -- and the gate then protects those tests too. What
# behaviour has to be covered is decided by `scripts/validation.json`, which
# maps each production file to the tests that must run for it; that mapping is
# reviewable, and a percentage is not.
#
# The comment that used to sit here claimed a `[tool.coverage.report]
# fail_under` that was never set, so it described a gate that did not exist.
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  # Not runtime code: the offline eval corpus, one-shot scripts, and the
  # single Alembic revision are exercised by their own gates, not by pytest.
  # `scripts/` is now covered by ruff, mypy, vulture and the CC/LOC policy --
  # every gate except the suite, which cannot run one-shot operational scripts.
  "evaluations/*",
  "scripts/*",
  "migrations/*",
  "tests/*",
]

[tool.coverage.report]
# No `fail_under`, on purpose -- see the note above `[tool.coverage.run]`.
show_missing = false
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '@(abc\.)?abstractmethod',
  '\.\.\.',
]

# Dependency hygiene. Answers the question no other gate here asks: is a
# declared dependency actually used, is a used package actually declared, and
# is anything relying on a transitive install? It found that `pydantic` and
# `starlette` -- imported in ~30 modules between them -- were declared nowhere
# and arrived only because FastAPI happened to pull them in; both are direct
# dependencies above now.
[tool.deptry]
# The `dev` extra is this project's ONE dev set (see the comment on it above),
# so its contents are tooling, not runtime imports.
optional_dependencies_dev_groups = ["dev"]
extend_exclude = ["migrations", "tests"]

[tool.deptry.per_rule_ignores]
# DEP002: declared, with no import to prove it. Each of these is loaded by
# something other than an `import` statement in `app/`, so an import scan
# cannot see the use. Anything NOT on this list that trips DEP002 is genuinely
# dead and should be removed rather than added here.
DEP002 = [
  # `alembic` is a CLI: alembic.ini + migrations/, run by the migrate service.
  "alembic",
  # SQLAlchemy loads the asyncpg driver by URL scheme (postgresql+asyncpg).
  "asyncpg",
  # Pydantic imports it lazily to validate `EmailStr`.
  "email-validator",
  # FastAPI raises at ROUTE DEFINITION time when a path declares `UploadFile`.
  # See the long note on the dependency itself.
  "python-multipart",
  # Ships the IANA zone database for `zoneinfo` on hosts without a system one.
  "tzdata",
  # The ASGI server: `uvicorn app.main:app` is the image CMD.
  "uvicorn",
]

[tool.mypy]
python_version = "3.12"
# ``evaluations`` and ``scripts`` are offline eval code and operational scripts,
# deliberately NOT part of the runtime package (setuptools ships ``app*`` only,
# and the API/worker image copies ``backend/app``). They are typechecked here
# anyway: an operational script that silently rots is a script nobody can run
# on the day they need it. ``scripts`` joining this list immediately caught two
# dead seams in ``seed_dev_data`` -- a monkeypatch onto an attribute that had
# moved packages, and an ``httpx.MockTransport`` passed where the Site Health
# worker wants an ``AcquisitionTransport``, both of which broke the seeder.
files = ["app", "evaluations", "scripts"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
# Bodies of unannotated functions are checked too; without this, an untyped
# helper is a hole the checker walks straight past.
check_untyped_defs = true
# ``==``/``!=`` between types that can never be equal is always a bug.
strict_equality = true
# NOT enabled: ``warn_unreachable``. Its eleven findings here are two kinds of
# false signal, not defects. Most are defensive ``if x is None`` guards that a
# third-party stub declares impossible (lxml's ``document_fromstring``), and
# ``verification_result`` guards a ``visibility_score`` the ORM maps as
# non-nullable -- deleting that one would erase the unknown-vs-zero distinction
# the invariants require, to satisfy a checker. Revisit if the column becomes
# nullable. ``warn_return_any`` is also off; its 70 findings are a separate,
# deliberate slice.
