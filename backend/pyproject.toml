[project]
name = "citeladder-backend"
version = "0.1.0"
description = "CiteLadder AI-Visibility backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "argon2-cffi>=25.1.0,<26",
  "asyncpg>=0.30.0,<1",
  "cryptography>=50.0.0,<51",
  "curl-cffi>=0.11,<1",
  "defusedxml>=0.7.1,<1",
  "email-validator>=2.3.0,<3",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "joserfc>=1.6.8,<2",
  "logfire[fastapi]>=4.20.0,<5",
  "lxml>=6.1.0,<7",
  "patchright>=1.52,<2",
  "protego>=0.3.1,<1",
  "pydantic-settings>=2.10.0,<3",
  # Required, with no direct import to prove it: FastAPI raises at ROUTE
  # DEFINITION time when a path declares ``UploadFile``, which the products and
  # prompts CSV import endpoints do. Removing it fails every test that touches
  # the app, not just the two upload routes.
  "python-multipart>=0.0.31,<1",
  "reportlab>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4.0,<27",
  "tldextract>=5.1.0,<6",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.35.0,<1",
]

# The ONE dev set. CI installs with ``uv sync --frozen --extra dev``, so an
# extra is the only declaration it is guaranteed to read; a parallel
# ``[dependency-groups] dev`` previously held ``asyncpg-stubs`` and re-declared
# two of these, leaving mypy's type coverage dependent on uv's default-group
# behaviour rather than on anything CI actually asks for.
[project.optional-dependencies]
dev = [
  "asyncpg-stubs>=0.31.3,<1",
  "lxml-stubs>=0.5.1,<1",
  "mypy>=2.3.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=7.0.0,<8",
  "radon==6.0.1",
  "ruff>=0.6.0,<1",
  "types-defusedxml>=0.7.0,<1",
  "types-reportlab>=4.5.1.20260728",
  "vulture==2.16",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# ``app/analysis/site_health/.ruff.toml`` extends this with BLE001 + S110 for
# the fact extractors only — see that file for why.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The test schema and its engine/connection pool are built once per session
# (see tests/conftest.py). Fixtures AND tests therefore have to share ONE event
# loop for the whole run: with the default function-scoped loop the pool binds
# to the first loop it sees, and every later test fails with "attached to a
# different loop". Both knobs are required — setting only the fixture scope
# leaves tests on their own loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Coverage is MEASURED and reported on every CI run; the floor below is the
# measured number rounded down, not an aspiration. Raising it is a deliberate
# step in the deferred test-corpus plan (docs/plans/backend-test-corpus-rework.md).
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  # Not runtime code: the offline eval corpus, one-shot scripts, and the
  # single Alembic revision are exercised by their own gates, not by pytest.
  "evaluations/*",
  "scripts/*",
  "migrations/*",
  "tests/*",
]

[tool.coverage.report]
# MEASURED, not chosen: the suite reports 84% statement+branch coverage of
# ``app`` today, so the floor is 84 — one point below is a real regression, not
# a rounding artefact. Raising it is a deliberate step in
# docs/plans/backend-test-corpus-rework.md, taken after the split lands
# coverage on the seams that are currently thin (agent_worker 0%,
# brand_discovery_worker 29%), never as a guess.
fail_under = 84
show_missing = false
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '@(abc\.)?abstractmethod',
  '\.\.\.',
]

[tool.mypy]
python_version = "3.12"
# ``evaluations`` is offline fixture/eval code that is deliberately NOT part of
# the runtime package (setuptools ships ``app*`` only, and the API/worker image
# copies ``backend/app``). It stays typechecked here so moving it out of
# ``app/`` did not silently drop it from the gate.
files = ["app", "evaluations"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
