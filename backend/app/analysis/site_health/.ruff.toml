# Extra lint gate for the Site Health fact extractors ONLY.
#
# This is the one package where fail-open silence caused real damage: a
# swallowed DOM traversal error emptied the fact bucket with no log and no
# error outcome, so the rules scored an extraction bug as "this page has no
# title / no CTAs / no forms". sh-extractor-8 narrowed those handlers to a
# documented exception set and routed every swallowed failure through
# ``dom.py``'s logger.
#
# BLE001 (blind ``except Exception``) and S110 (``try``/``except``/``pass``)
# keep it that way. They are deliberately NOT repo-wide: elsewhere a broad
# handler is often correct (worker loop backstops, rollback teardown), and
# enabling them globally would bury this signal in noise.
extend = "../../../pyproject.toml"

[lint]
extend-select = ["BLE001", "S110"]
